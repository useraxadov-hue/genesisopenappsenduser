<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGenesis</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Asosiy fonni qop-qora qilish */
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }
        
        /* Matn boshida yashiringan turadi */
        #status {
            display: none;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="status">Xabar yuborilmoqda... kuting.</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Telegram tepa va past qismlarini ham qora rangga bo'yash
        try {
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        } catch (e) {}

        const token = "8867570993:AAEp5T0rMDzaQxznDosZ4IQk65TjTAx2GBA";
        
        // Havola parametrlarini o'qish
        const startParam = tg.initDataUnsafe?.start_param;

        // Agar havola orqali parametr kelsa
        if (startParam) {
            const type = startParam.charAt(0); // 'c' yoki 'i'
            
            // Parametrni 'b' harfi orqali bo'lish
            const restOfString = startParam.slice(1);
            const parts = restOfString.split('b');
            
            const chatId = parts[0];
            const orderId = parts[1];

            if (chatId && orderId && (type === 'c' || type === 'i')) {
                // Parametrlar to'g'ri bo'lsa, status matnini chiqarish va yuborish
                document.getElementById('status').style.display = 'block';
                sendNotification(type, chatId, orderId);
            }
        } 
        // Agar startParam bo'lmasa (oddiy kirilsa), HEC NARSA QILMAYDI. Ekranda qora fon qolaveradi.

        async function sendNotification(type, chatId, orderId) {
            let stickerId, messageText;

            if (type === 'c') {
                stickerId = "CAACAgIAAxkBAAER1fBqmGHdZ1cgyeNYWTTHdknnBVJwfAACL6EAAjY6wUicCG6wcRtMoj0E";
                messageText = `#${orderId} Sizning chekingiz qabul qilindi va buyurtmagiz pochtaga topshirildi ✅ Yordam uchun @gogenesis_support_bot`;
            } else {
                stickerId = "CAACAgIAAxkBAAER1e5qmGFEQT_cLKbb_QdYeQqFntnkFwACrZwAAr0rwUg8scTygAw4KD0E";
                messageText = `#${orderId} Sizning chekingiz qabul qilinmadi va buyurtmagiz pochtaga topshirilmadi ❌ Yordam uchun @gogenesis_support_bot`;
            }

            try {
                // Stikerni yuborish
                await fetch(`https://api.telegram.org/bot${token}/sendSticker?chat_id=${chatId}&sticker=${stickerId}`);
                
                // Xabarni yuborish
                await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(messageText)}`);

                tg.HapticFeedback.notificationOccurred('success');
                
                // Adminga xabar yetkazilgani haqida bildirishnoma
                alert("Foydalanuvchiga xabar yetkazildi ✅");
                
                // Barcha ish tugagach, Mini App'ni yopish
                tg.close();

            } catch (error) {
                console.error(error);
                alert("Tarmoqda xatolik yuz berdi!");
                tg.close(); // Xato bo'lsa ham yopib yuborish
            }
        }
    </script>
</body>
</html>
